# ==============================================================================
# Shared phpBB Extension Crowdin Configuration
# ==============================================================================
#
# Applies to every phpBB extension.
#
# Extension identity comes from composer.json.
# Language support is built into crowdin-init.sh.
# ==============================================================================

SOURCE_LANGUAGE=en

SOURCE_SYNC=true

CROWDIN_CLI_TEMPLATE=crowdin.yml.template

# Optional global settings:
#
# PROJECT_VISIBILITY=open
# LANGUAGE_ACCESS_POLICY=open
